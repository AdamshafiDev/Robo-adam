- name: configration of catalogue file
  hosts: catalogue
  become: yes
  tasks:
   - name: disble node js old verstion
     ansible.builtin.command: dnf module disable nodejs -y
     ansible.builtin.command: dnf module enable nodejs:20 -y

   - name: install nodejs
     ansible.builtin.dnf:
      name: nodejs
      state: installed

   - name: create the ronboshop user
     ansible.builtin.user:
      name: roboshop
      shell: /sbin/nologin
      system: true
      home: /app
   - name: create app direcctory
     ansible.builtin.file:
      path: /app
      state: directory


   - name: download code in app directory
     ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
      dest: /tmp/catalogue.zip


   - name: extract the code in zip
     ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes


   - name: install dependcy npm
     community.general.npm:
      path: /app    

   - name: copy the cataloge systemd file
     ansible.builtin.copy:
       src: catalogue.service
       dest: /etc/systemd/system/catalogue.service 
   - name: sysstemdemaon reload
     ansible.builtin.systemd_service:
      daemon_reload: true

   - name: enable and start catalogue
      ansible.builtin.service:
       name: catalogue
       state: started
       enabled: yes  

   - name: copy mongodb repo
     ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

   - name: install mongodb clint
     ansible.builtin.dnf:
      name: mongodb-mongosh
      state: present

   - name: products load
     ansible.builtin.command: mongosh --host mongodb.adamshafi.shop --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
     register: catalogue_output
         
   - name: print the catalogue_output
     ansible.builtin.debug:
      msg: "{{catalogue_output}}" 

   - name: load the products
     ansible.builtin.shell: mongosh --host mongodb.adamshafi.shop </app/db/master-data.js  
     when: catalogue_output.stdout | int < 0

