- name: confiration python
  hosts: payments
  become: yes
  tasks:
   - name: install payments 
     ansible.builtin.dnf:
      name: "{{ item }}"
      state: present
     loop:
      - python3 
      - gcc 
      - python3-devel

- name: create the ronboshop user
  ansible.builtin.user:
      name: roboshop
      shell: /sbin/nologin
      system: true
      home: /app

- name: create app direcctory
  ansible.builtin.file:
      path: /app
      state: directory


- name: download code in app directory
  ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
      dest: /tmp/payment.zip


- name: extract the code in zip
  ansible.builtin.unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes 


- name: install dependcy
  ansible.builtin.pip:
   requirements:
   excutable: pip 3.9
  args:
     chdir: /app
- name: copy the payment service
  ansible.builtin.copy:
   src: payment.service
   dest: /etc/systemd/system/payment.service
 
- name: systemdemaon reload
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: start and enable the service
  ansible.builtin.service:
   name: payment 
   state: started
   enabled: yes