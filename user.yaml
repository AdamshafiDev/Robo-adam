- name: configration of user file
  hosts: user
  become: yes
  tasks:
   - name: disble node js old verstion
     ansible.builtin.command: dnf module disable nodejs -y
     ansible.builtin.command: dnf module enable nodejs:20 -y

   - name: install nodejs
     ansible.builtin.dnf:
      name: nodejs
      state: installed

   - name: create the ronboshop user
     ansible.builtin.user:
      name: roboshop
      shell: /sbin/nologin
      system: true
      home: /app
   - name: create app direcctory
     ansible.builtin.file:
      path: /app
      state: directory


   - name: download code in app directory
     ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip
      dest: /tmp/user.zip


   - name: extract the code in zip
     ansible.builtin.unarchive:
      src: /tmp/user.zip
      dest: /app
      remote_src: yes


   - name: install dependcy npm
     community.general.npm:
      path: /app    

   - name: copy the cataloge systemd file
     ansible.builtin.copy:
       src: user.service
       dest: /etc/systemd/system/user.service 
   - name: sysstemdemaon reload
     ansible.builtin.systemd_service:
      daemon_reload: true

   - name: enable and start user
     ansible.builtin.service:
       name: user
       state: started
       enabled: yes  

   - name: copy mongodb repo
     ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
