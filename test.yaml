- name: testing install mongodb in servers
  become: yes
  hosts: che
  tasks: 
   - name: copy mongodb repo
     ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

   - name: install mongodb
     ansible.builtin.dnf:
      name: mongodb-org
      state: present

   - name: start mongodb
     ansible.builtin.service:
      name: mongod 
      state: started
      enabled: yes   