- name: Shipping configuration
  hosts: shipping
  become: yes

  tasks:
    - name: Install Maven and MySQL
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      loop:
        - maven
        - mysql

    - name: Install Python dependencies
      ansible.builtin.pip:
        name: "{{ item }}"
        executable: pip3.9
      loop:
        - PyMySQL
        - cryptography

    - name: Create roboshop user
      ansible.builtin.user:
        name: roboshop
        shell: /sbin/nologin
        system: true
        home: /app

    - name: Create app directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download shipping application
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip
        dest: /tmp/shipping.zip

    - name: Extract shipping application
      ansible.builtin.unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: yes

    - name: Install Maven dependencies
      ansible.builtin.command: mvn clean package
      args:
        chdir: /app

    - name: Rename JAR file
      ansible.builtin.command: mv target/shipping-1.0.jar shipping.jar
      args:
        chdir: /app

    - name: Copy shipping systemd service
      ansible.builtin.copy:
        src: shipping.service
        dest: /etc/systemd/system/shipping.service

    - name: Reload systemd daemon
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Start and enable shipping
      ansible.builtin.service:
        name: shipping
        state: started
        enabled: yes

    - name: Import MySQL data
      tags:
        - import
      community.mysql.mysql_db:
        name: all
        login_user: root
        login_password: RoboShop@1
        login_host: mysql.adamshafi.shop
        state: import
        target: "{{ item }}"
      loop:
        - /app/db/schema.sql
        - /app/db/app-user.sql
        - /app/db/master-data.sql

    - name: Restart shipping service
      ansible.builtin.service:
        name: shipping
        state: restarted