- name: configration of cart file
  hosts: cart
  become: yes
  tasks:
   - name: disble node js old verstion
     ansible.builtin.command: dnf module disable nodejs -y
     ansible.builtin.command: dnf module enable nodejs:20 -y

   - name: install nodejs
     ansible.builtin.dnf:
      name: nodejs
      state: installed

   - name: create the ronboshop cart
     ansible.builtin.cart:
      name: roboshop
      shell: /sbin/nologin
      system: true
      home: /app
   - name: create app direcctory
     ansible.builtin.file:
      path: /app
      state: directory


   - name: download code in app directory
     ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
      dest: /tmp/cart.zip


   - name: extract the code in zip
     ansible.builtin.unarchive:
      src: /tmp/cart.zip
      dest: /app
      remote_src: yes


   - name: install dependcy npm
     community.general.npm:
      path: /app    

   - name: copy the cataloge systemd file
     ansible.builtin.copy:
       src: cart.service
       dest: /etc/systemd/system/cart.service 
   - name: sysstemdemaon reload
     ansible.builtin.systemd_service:
      daemon_reload: true

   - name: enable and start cart
     ansible.builtin.service:
       name: cart
       state: started
       enabled: yes  

   