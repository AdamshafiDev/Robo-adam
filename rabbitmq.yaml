- name: confiration rabbiqmq
  hosts: rabbitmq
  become: yes
  tasks:
   - name: copy the repos rabbitmq 
     ansible.builtin.copy:
      src: rabbitmq.repo
      dest: /etc/yum.repos.d/rabbitmq.repo

   - name: install rabbitmq server
     ansible.builtin.dnf:
      name: rabbitmq-server
      state: installed

   - name: start and enable server
     ansible.builtin.service:
      name: rabbitmq-server
      state: started
      enabled: yes

   - name: add the user
     community.rabbitmq.rabbitmq_user:   
       user: roboshop
       password: roboshop123
       permissions:
        - vhost: /
          exchange: amq.topic
          read_priv: .*
          write_priv: 'prod\\.logging\\..*'
       state: present
    



